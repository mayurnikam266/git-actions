# .github/workflows/generate-ascii.yml
name: Generate ASCII Artwork
on:
  push:
    branches:
      - main

jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install cowsay
        run: sudo apt-get update && sudo apt-get install cowsay -y

      - name: Generate ASCII dragon
        run: cowsay -f dragon "Run for cover, I am a DRAGON.... RAWR" >> dragon.txt

      - name: Pause for 30 seconds
        run: sleep 30
    
      - name: using upload artifact for next job
        uses: actions/upload-artifact

  test_job_2:
    runs-on: ubuntu-latest
    steps:

      - name: Pause for 10 seconds
        run: sleep 10
      
      - name: download artificat to download files from previos job
        uses: actions/download-artifact

      - name: Verify dragon.txt
        run: grep -i "dragon" dragon.txt
      
      - 
      

  deploy_job_3:
    runs-on: ubuntu-latest
    steps:
      - name: download artificat to download files from previos job
        uses: actions/download-artifact

      - name: Display dragon.txt
        run: cat dragon.txt

      - name: Simulate deployment
        run: echo "Deploying dragon.txt..."